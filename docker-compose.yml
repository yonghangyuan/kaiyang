version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kaiyang-pg
    environment:
      POSTGRES_USER: kaiyang
      POSTGRES_PASSWORD: kaiyang
      POSTGRES_DB: kaiyang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaiyang"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaiyang-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

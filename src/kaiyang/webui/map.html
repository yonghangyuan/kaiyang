<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开阳 · 态势地图</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e27;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}
.header{background:#131a35;padding:8px 12px;color:#e2c860;font-size:14px;font-weight:700;border-bottom:1px solid #1e2a4a;display:flex;align-items:center;gap:10px;min-height:40px}
.header .sub{font-size:11px;color:#64748b;font-weight:400}
.main{display:flex;flex:1;overflow:hidden}
#map{flex:1;min-width:0}
.sidebar{width:380px;background:#0f1630;border-left:1px solid #1e2a4a;display:flex;flex-direction:column}
.sidebar-tabs{display:flex;border-bottom:1px solid #1e2a4a}
.sidebar-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:#131a35;color:#64748b;border:none;border-bottom:2px solid transparent}
.sidebar-tab.active{color:#e2c860;border-bottom-color:#e2c860;background:#0f1630}
.sidebar-body{flex:1;overflow-y:auto;padding:10px 12px}
.sidebar-input-area{background:#131a35;padding:8px;border-top:1px solid #1e2a4a;display:flex;gap:6px}
.sidebar-input-area input{flex:1;background:#0f1630;border:1px solid #1e2a4a;color:#c9d1d9;padding:8px 10px;border-radius:4px;font-size:13px}
.sidebar-input-area button{background:#2563eb;color:#fff;border:none;padding:8px 14px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
.sidebar-input-area button:hover{background:#1d4ed8}
.chat-msg{padding:8px 10px;margin:4px 0;border-radius:6px;font-size:13px;line-height:1.5;max-width:95%;animation:fadeIn .2s}
.chat-msg.user{background:#1e40af;margin-left:auto;text-align:right}
.chat-msg.ai{background:#131a35;border:1px solid #1e2a4a}
.chat-msg .time{font-size:10px;color:#64748b;margin-top:2px}
.chat-msg.error{background:#3b1111;border:1px solid #7f1d1d;color:#fca5a5}
.briefing-summary{background:#131a35;padding:10px;border-radius:6px;font-size:12px;line-height:1.6;margin-bottom:12px;border-left:3px solid #2563eb}
.timeline-item{padding:8px 10px;border-left:2px solid #1e2a4a;margin-left:10px;position:relative;cursor:pointer;font-size:12px;margin-bottom:2px}
.timeline-item:hover{background:#131a35}
.timeline-item.event{border-left-color:#eab308}
.timeline-item.intel{border-left-color:#3b82f6}
.timeline-item.web{border-left-color:#a855f7}
.timeline-dot{position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:#1e2a4a;border:2px solid #3b82f6}
.timeline-item.event .timeline-dot{background:#eab308;border-color:#eab308}
.timeline-item.web .timeline-dot{background:#a855f7;border-color:#a855f7}
.timeline-item .time{color:#64748b;font-size:10px}
.timeline-item .title{color:#c9d1d9;margin-top:2px;line-height:1.4}
.timeline-item .meta{color:#475569;font-size:10px;margin-top:2px}
.issue-card{background:#131a35;padding:8px;border-radius:4px;margin:4px 0;font-size:11px;border-left:3px solid #22c55e}
.issue-card .status{font-size:10px;padding:1px 6px;border-radius:3px}
.issue-card .status.open{background:#2563eb;color:#fff}
.issue-card .status.closed{background:#374151;color:#9ca3af}
.empty-state{text-align:center;padding:40px 20px;color:#475569;font-size:13px}
.info-bar{color:#94a3b8;font-size:11px;padding:3px 12px;background:#0a0e27;display:flex;gap:16px}
.toggle-sidebar{background:none;border:1px solid #334155;color:#94a3b8;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="header">
  &#x1F5FA; 开阳 · 态势感知
  <span class="sub">| AI 对话 + 联网搜索 + 时间线</span>
  <button class="toggle-sidebar" onclick="toggleSidebar()" id="toggle-btn">收起面板</button>
</div>
<div class="info-bar">
  <span id="event-count">就绪</span><span id="status" style="color:#64748b"></span>
  <span id="chat-status" style="color:#64748b;margin-left:auto"></span>
</div>
<div class="main">
<div id="map"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" id="tab-search" onclick="switchTab('search')">🔍 搜索</button>
    <button class="sidebar-tab" id="tab-chat" onclick="switchTab('chat')">💬 对话</button>
  </div>
  <div class="sidebar-body" id="sidebar-body"></div>
  <div class="sidebar-input-area" id="sidebar-input">
    <input id="chat-input" placeholder="输入消息或搜索词..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()" id="send-btn">发送</button>
    <button onclick="clearChat()" style="background:#374151;font-size:11px">清空</button>
  </div>
</div>
</div>

<script>
var L; function loadLeaflet(u,f){var s=document.createElement('script');s.src=u;s.onload=function(){if(typeof L!=='undefined')initMap()};s.onerror=f;document.head.appendChild(s)}
function tryBootCDN(){loadLeaflet('https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js',tryCdnjs)}
function tryCdnjs(){loadLeaflet('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',function(){document.getElementById('status').textContent='Leaflet failed'})}
tryBootCDN();

var API='/api', map, eventMarkers=[], searchMarkers=[], annoLayer=[], chatHistory=[], currentTab='search';

// WebSocket 实时推送
var ws=null, wsReconnectTimer=null;
function connectWS(){
  if(ws)try{ws.close()}catch(e){}
  var protocol=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(protocol+'://'+location.host+'/ws');
  ws.onopen=function(){document.getElementById('chat-status').textContent='实时连接';if(wsReconnectTimer)clearInterval(wsReconnectTimer)};
  ws.onmessage=function(evt){
    try{
      var d=JSON.parse(evt.data);
      if(d.type==='fetch_complete'&&d.new_items>0){
        document.getElementById('chat-status').textContent='新情报:'+d.new_items+'条';
        document.getElementById('status').textContent='实时更新: +'+d.new_items+'条情报'+(d.new_events?' +'+d.new_events+'事件':'');
        setTimeout(function(){loadAllEvents()},2000);
      }
    }catch(e){}
  };
  ws.onclose=function(){document.getElementById('chat-status').textContent='离线';wsReconnectTimer=setInterval(connectWS,15000)};
}
connectWS();

function initMap(){
  map=L.map('map').setView([35,105],4);
  var tiles={
    '高德卫星':L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',attribution:'高德',maxZoom:18}),
    'CartoDB全球':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:'CartoDB',maxZoom:19}),
    'ESRI卫星':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'ESRI',maxZoom:17}),
    'OpenStreetMap':L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',attribution:'OSM',maxZoom:19}),
  };
  tiles['CartoDB全球'].addTo(map);
  L.control.layers(tiles,null,{position:'bottomright'}).addTo(map);
  loadAllEvents();
  loadAnnotations();
}

// ── 标注层 ──
async function loadAnnotations(){
  clearAnnoLayer();
  try{
    var r=await fetch(API+'/annotations'); var d=await r.json();
    (d.annotations||[]).forEach(function(a){
      var coords=a.coordinates;
      if(a.type==='polyline' && Array.isArray(coords) && coords.length>=2){
        var line=L.polyline(coords,{color:a.style?.color||'#ef4444',weight:a.style?.weight||3,opacity:0.8}).bindPopup('<b>'+esc(a.name)+'</b><br><small>'+esc(a.description||'')+'</small><br><a href=# onclick="deleteAnno(\''+a.id+'\');return false" style=color:#ef4444>删除</a>').addTo(map);
        annoLayer.push(line);
        // 标记起点终点
        var start=L.circleMarker(coords[0],{radius:6,fillColor:'#22c55e',color:'#fff',weight:1,fillOpacity:0.9}).bindPopup('起点: '+esc(a.name)).addTo(map);
        var end=L.circleMarker(coords[coords.length-1],{radius:6,fillColor:'#ef4444',color:'#fff',weight:1,fillOpacity:0.9}).bindPopup('终点: '+esc(a.name)).addTo(map);
        annoLayer.push(start,end);
      }else if(a.type==='point'){
        var pt=Array.isArray(coords)?coords:[coords.lat||0,coords.lng||0];
        var m=L.marker(pt,{title:a.name}).bindPopup('<b>'+esc(a.name)+'</b><br><a href=# onclick="deleteAnno(\''+a.id+'\');return false" style=color:#ef4444>删除</a>').addTo(map);
        annoLayer.push(m);
      }
    });
    if(d.count>0)document.getElementById('status').textContent='标注:'+d.count;
  }catch(e){}
}
function clearAnnoLayer(){annoLayer.forEach(function(l){map.removeLayer(l)});annoLayer=[]}
async function deleteAnno(id){await fetch(API+'/annotations/'+id,{method:'DELETE'});clearAnnoLayer();loadAnnotations()}

// ── 事件链可视化 ──
async function showIssueChain(issueId){
  document.getElementById('status').textContent='加载事件链...';
  try{
    var r=await fetch(API+'/issues/'+issueId+'/chain'); var d=await r.json();
    clearSearchMarkers();
    var chainMarkers=[];
    // 画连线
    d.edges.forEach(function(edge){
      var fromNode=d.nodes.find(function(n){return n.id===edge.from});
      var toNode=d.nodes.find(function(n){return n.id===edge.to});
      if(fromNode&&toNode){
        var line=L.polyline([[fromNode.lat,fromNode.lng],[toNode.lat,toNode.lng]],{
          color:'#eab308',weight:2,dashArray:'6,4',opacity:0.7
        }).bindPopup(fromNode.relation+' → '+toNode.relation).addTo(map);
        chainMarkers.push(line);
      }
    });
    // 画节点
    d.nodes.forEach(function(n,i){
      var color=n.relation==='cause'?'#3b82f6':n.relation==='trigger'?'#f97316':n.relation==='core'?'#ef4444':n.relation==='consequence'?'#eab308':'#22c55e';
      var m=L.circleMarker([n.lat,n.lng],{radius:10,fillColor:color,color:'#fff',weight:2,fillOpacity:0.9})
        .bindPopup('<b>'+esc(n.relation)+'</b>: '+esc(n.title)+'<br><small>'+n.time+' | 重要度:'+(n.severity||0)+'/10</small>').addTo(map);
      chainMarkers.push(m);
      // 序号标签
      var label=L.divIcon({html:'<div style="background:'+color+';color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:11px;font-weight:700">'+(i+1)+'</div>',className:'',iconSize:[20,20]});
      L.marker([n.lat,n.lng],{icon:label}).addTo(map);
    });
    searchMarkers=chainMarkers;
    document.getElementById('status').textContent='事件链: '+d.nodes.length+'个节点, '+d.edges.length+'条连线';
  }catch(e){document.getElementById('status').textContent='事件链加载失败'}
}

function toggleSidebar(){
  var s=document.getElementById('sidebar'),b=document.getElementById('toggle-btn');
  if(s.style.display==='none'){s.style.display='flex';b.textContent='收起面板'}
  else{s.style.display='none';b.textContent='展开面板'}
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.sidebar-tab').forEach(function(t){t.classList.remove('active')});
  document.getElementById('tab-'+tab).classList.add('active');
  renderSidebar();
}

function renderSidebar(){
  var body=document.getElementById('sidebar-body');
  if(currentTab==='search'){
    body.innerHTML='<div class="empty-state">输入关键词搜索<br><small>联网+本地双重搜索，自动标注地图</small></div>';
  }else{
    if(chatHistory.length===0){
      body.innerHTML='<div class="empty-state">💬 开阳 AI 助手<br><small>可以问我新闻、事件分析、或任何问题</small></div>';
    }else{
      body.innerHTML=chatHistory.map(function(m){
        var cls=m.role==='user'?'user': m.error?'ai error':'ai';
        return '<div class="chat-msg '+cls+'">'+esc(m.content)+'<div class=time>'+m.time+'</div></div>';
      }).join('');
      body.scrollTop=body.scrollHeight;
    }
  }
}

async function sendMessage(){
  var input=document.getElementById('chat-input'), msg=input.value.trim();
  if(!msg)return; input.value=''; input.focus();

  var now=new Date().toLocaleTimeString();

  if(currentTab==='search'){
    // Search mode: briefing + map
    document.getElementById('status').textContent='AI 分析中...';
    addChatMsg('user',msg,now);
    try{
      var r=await fetch(API+'/search/briefing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:msg,limit:30})});
      var d=await r.json();
      renderBriefing(d);
      var summary=(d.summary||'搜索完成').replace(/\*\*/g,'').replace(/###? /g,'');
      addChatMsg('ai',summary+' (本地'+d.timeline_count+'条'+(d.web_count?' + 联网'+d.web_count:'')+')',now);
    }catch(e){
      addChatMsg('ai','搜索失败: '+e.message,now,true);
    }
  }else{
    // Chat mode: AI对话 + 自动搜索标注
    document.getElementById('chat-status').textContent='思考中...';
    addChatMsg('user',msg,now);
    try{
      // 并行：对话 + 搜索（各自容错）
      var chatD={reply:'对话请求中...'}, searchD={point_count:0,timeline_count:0};
      var chatP=fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})})
        .then(function(r){return r.json()}).catch(function(e){return {reply:'对话失败: '+e.message,error:true}});
      var searchP=fetch(API+'/search/briefing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:msg,limit:20})})
        .then(function(r){return r.json()}).catch(function(e){return {point_count:0,timeline_count:0}});
      var results=await Promise.all([chatP, searchP]);
      chatD=results[0]; searchD=results[1];
      // 清理 markdown 格式
      var reply=(chatD.reply||'(空)').replace(/\*\*/g,'').replace(/###? /g,'').replace(/__/g,'');
      addChatMsg('ai',reply,now,chatD.error);
      document.getElementById('chat-status').textContent=chatD.model?'模型: '+chatD.model:'';
      // 自动标注: 搜索 + AI回复坐标解析
      if(searchD.point_count>0){
        renderBriefing(searchD);
        document.getElementById('status').textContent='自动标注: '+searchD.point_count+'个点, '+searchD.timeline_count+'条';
      }
      // 从AI回复中提取坐标 → 创建标注
      try{
        var ar=await fetch(API+'/annotations/from-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:reply})});
        var ad=await ar.json();
        if(ad.ok){loadAnnotations();document.getElementById('status').textContent+=' | '+ad.coordinates_count+'个坐标标注'}
      }catch(e){}
    }catch(e){
      addChatMsg('ai','连接失败: '+e.message,now,true);
      document.getElementById('chat-status').textContent='离线';
    }
  }
}

function addChatMsg(role,content,time,error){
  chatHistory.push({role:role,content:content,time:time,error:error});
  if(chatHistory.length>50)chatHistory.shift();
  if(currentTab==='chat'||role==='user')renderSidebar();
}

function renderBriefing(d){
  clearSearchMarkers();
  var html='';
  if(d.summary)html+='<div class=briefing-summary>'+esc(d.summary)+'</div>';
  if(d.issues&&d.issues.length>0){
    html+='<div style="font-size:12px;color:#e2c860;margin-bottom:4px">关联Issue</div>';
    d.issues.forEach(function(i){html+='<div class=issue-card><b>'+esc(i.title)+'</b> <span class="status '+i.status+'">'+i.status+'</span></div>'});
  }
  html+='<div style="font-size:12px;color:#e2c860;margin:8px 0 4px">时间线 (本地'+d.timeline_count+'条'+(d.web_count?' + 联网'+d.web_count:'')+')</div>';
  if(d.timeline.length===0)html+='<div class=empty-state>未找到结果</div>';
  d.timeline.forEach(function(t){
    html+='<div class="timeline-item '+t.type+'"><div class=timeline-dot></div>';
    html+='<div class=time>'+(t.time||'').substring(0,16)+'</div>';
    html+='<div class=title>'+esc(t.title||'')+'</div>';
    html+='<div class=meta>'+(t.type==='web'?'🌐 联网':'')+(t.country||'')+(t.severity?' | 重要度:'+t.severity:'')+'</div></div>';
  });
  document.getElementById('sidebar-body').innerHTML=html;
  // Map markers
  (d.points||[]).forEach(function(p){
    if(!p.lat||!p.lng)return;
    var c=p.source==='briefing_event'?'#eab308':'#3b82f6';
    L.circleMarker([p.lat,p.lng],{radius:7,fillColor:c,color:'#fff',weight:1,fillOpacity:0.7})
     .bindPopup('<b>'+esc(p.title||'')+'</b><br><small>'+(p.country_code||'')+'</small>').addTo(map);
  });
  document.getElementById('status').textContent=d.point_count+'个标注, '+d.timeline_count+'条时间线';
}

function clearChat(){chatHistory=[];renderSidebar();document.getElementById('chat-status').textContent=''}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Event markers
function clearEventMarkers(){eventMarkers.forEach(function(m){map.removeLayer(m)});eventMarkers=[]}
function clearSearchMarkers(){searchMarkers.forEach(function(m){map.removeLayer(m)});searchMarkers=[]}
async function loadAllEvents(){
  try{
    var r=await fetch(API+'/map/plot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:100})});
    var d=await r.json();clearEventMarkers();
    (d.points||[]).forEach(function(e){
      if(!e.lat||!e.lng)return;
      var c=e.severity>=7?'#ef4444':e.severity>=5?'#f97316':e.severity>=3?'#eab308':'#22c55e';
      L.circleMarker([e.lat,e.lng],{radius:Math.min(6+(e.severity||1)*1.5,20),fillColor:c,color:'#fff',weight:1,fillOpacity:0.8})
       .bindPopup('<b>'+esc(e.title)+'</b><br><small>'+(e.country_code||'')+' | 重要度:'+(e.severity||1)+'/10</small><br><a href=# onclick="loadItems(\''+e.id+'\');return false">查看报道</a> | <a href=# onclick="tianshuSearch(\''+encodeURIComponent(e.title||'')+'\');return false">天枢搜索</a><div id=it-'+e.id+'></div>').addTo(map);
    });
    document.getElementById('event-count').textContent='事件:'+d.count;
  }catch(e){}
}
async function loadItems(eid){
  var d=document.getElementById('it-'+eid);if(!d)return;d.innerHTML='<small>加载中...</small>';
  try{
    var r=await fetch(API+'/events/'+eid+'/items');var j=await r.json();
    var h='<hr style="border-color:#1e2a4a;margin:4px 0"><small>';
    j.items.slice(0,5).forEach(function(i){h+='<div>&bull; <a href="'+esc(i.url)+'" target=_blank style=color:#60a5fa>'+esc((i.title||'').substring(0,60))+'</a></div>'});
    d.innerHTML=h+'</small>';
  }catch(e){d.innerHTML='<small style=color:#ef4444>加载失败</small>'}
}
function tianshuSearch(title){
  var w=window.open('','_blank','width=800,height=600');
  if(!w)return;
  w.document.write('<body style="font-family:sans-serif;padding:20px;background:#0a0e27;color:#c9d1d9"><h2 style=color:#e2c860>天枢搜索</h2><p>'+esc(title)+'</p><p style=color:#64748b>连接中...</p>');
  fetch('http://175.27.157.139:8720/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:'请搜集关于"'+title+'"的最新报道和背景信息。'})})
    .then(function(r){return r.json()}).then(function(d){
      w.document.body.innerHTML='<div style=max-width:700px;margin:0 auto><h2 style=color:#e2c860>天枢简报</h2><pre style=white-space:pre-wrap;font-size:14px;line-height:1.6>'+esc(d.content||'空')+'</pre></div>';
    }).catch(function(){w.document.body.innerHTML='<p style=color:#ef4444>天枢连接失败</p>'});
}
</script>
</body>
</html>
